{% extends "onboarding/base.html" %}
{% load static %}

{% block content %}

    <!-- Main Content -->
    <div class="main-content">
        <div class="onboarding-card">
            <!-- Role Indicator -->
            <div class="role-indicator" >
                <!-- Progress Bar -->
                <div class="container" >
                    <div class="progress-container">
                        
                        <div class="step-info">
                            <span class="text-muted">Startup Onboarding: Step 1 of 4</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" style="width: 25%"></div>
                        </div>
                    </div>
                </div>
            </div>

            

            <!-- Company Information Form -->
            <div class="">
                <h2 class="form-title">Market and Traction</h2>
                
                <form id="companyForm" method="POST" action="{% url 'onboarding_startup_step2' %}">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="company_description" class="form-label">How many active users (of your product/ solution) does your company currently have?</label>
                        <textarea class="form-control text-area" id="company_description" name="company_description" 
                                    placeholder="Tell us briefly about your company, mission and team" rows="4"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="company_description" class="form-label">How many paying customers does your company currently have?</label>
                        <textarea class="form-control text-area" id="company_description" name="company_description" 
                                    placeholder="Tell us briefly about your company, mission and team" rows="4"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Has your company secured any external funding to date?</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="external_funding" id="funding_yes" value="yes" required>
                                <label class="form-check-label" for="funding_yes">Yes</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="external_funding" id="funding_no" value="no" required>
                                <label class="form-check-label" for="funding_no">No</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="company_name" class="form-label">What is your annual recurring revenue? (in USD)</label>
                        <input type="text" class="form-control" id="company_name" name="company_name" 
                                placeholder="Your company or project name" required>
                    </div>

                    <!-- Button Group -->
                    <div class="button-group">
                        <button type="button" class="btn btn-back">Back</button>
                        <button type="submit" class="btn btn-continue">Continue</button>
                    </div>
                </form>

                
            </div>

            
        </div>
    </div>


{% endblock %}
