{% extends "onboarding/base.html" %}
{% load static %}

{% block content %}
    <!-- Main Content -->
    <div class="main-content">
        <div class="onboarding-card">
            <!-- Role Indicator -->
            <div class="role-indicator" >
                <!-- Progress Bar -->
                <div class="container" >
                    <div class="progress-container">
                        
                        <div class="step-info">
                            <span class="text-muted">Startup Onboarding: Step 2 of 4</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" style="width: 50%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Innovation Information Form -->
            <div class="">
                <h2 class="form-title">About your innovation</h2>
                
                <form id="innovationForm" method="POST" action="">
                    {% csrf_token %}
                    
                    <!-- Type of Innovation -->
                    <div class="form-group">
                        <label class="form-label">Type of Innovation (select all that apply)</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="plastic_alternatives" name="innovation_type" value="plastic_alternatives">
                                <label for="plastic_alternatives">Eliminate & Redesign Packaging</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="recycling_technologies" name="innovation_type" value="recycling_technologies">
                                <label for="recycling_technologies">Refill & Reuse Solutions</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="waste_collection" name="innovation_type" value="waste_collection">
                                <label for="waste_collection">Reusable Packaging Collection/Drop Off</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="circular_economy" name="innovation_type" value="circular_economy">
                                <label for="circular_economy">Upcycling Plastic Waste</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="monitoring_tools" name="innovation_type" value="monitoring_tools">
                                <label for="monitoring_tools">Sustainable Alternative Materials</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="ocean_cleanup" name="innovation_type" value="ocean_cleanup">
                                <label for="ocean_cleanup">Education & Industry Partnerships</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="ocean_cleanup" name="innovation_type" value="ocean_cleanup">
                                <label for="ocean_cleanup">Tracking & Monitoring Waste</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="ocean_cleanup" name="innovation_type" value="ocean_cleanup">
                                <label for="ocean_cleanup">Plastic Footprint Offsetting</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="ocean_cleanup" name="innovation_type" value="ocean_cleanup">
                                <label for="ocean_cleanup">Enhancing Plastic Recycling Systems</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="ocean_cleanup" name="innovation_type" value="ocean_cleanup">
                                <label for="ocean_cleanup">Improved Waste Collection Systems</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="ocean_cleanup" name="innovation_type" value="ocean_cleanup">
                                <label for="ocean_cleanup">Other</label>
                            </div>
                        </div>
                    </div>

                    <!-- Brief Company Description -->
                    <div class="form-group">
                        <label for="company_description" class="form-label">Please describe your solution and it's USP in one paragraphThis question is required.*</label>
                        <textarea class="form-control text-area" id="company_description" name="company_description" 
                                    placeholder="Tell us briefly about your company, mission and team" rows="4"></textarea>
                    </div>

                    <!-- Current Stage of Solution -->
                    <div class="form-group">
                        <label for="current_stage" class="form-label">Current Stage of Solution</label>
                        <select class="form-select" id="current_stage" name="current_stage" required>
                            <option value="">Select current stage</option>
                            <option value="idea">Ideation – Developing an idea, no product yet.</option>
                            <option value="prototype">Prototype – Initial MVP or prototype created.</option>
                            <option value="validation">Validation – Testing with early customers, gathering feedback.</option>
                            <option value="early">Early Growth – Generating revenue, growing customer base.</option>
                            <option value="scaling">Scaling – Expanding with proven business model and revenue.</option>
                            <option value="profitable">Established – Profitable, exploring new markets or innovations.</option>
                        </select>
                    </div>

                    <!-- Funding Needed -->
                    <div class="form-group">
                        <label for="funding_needed" class="form-label">Funding Needed</label>
                        <select class="form-select" id="funding_needed" name="funding_needed" required>
                            <option value="">Select funding range</option>
                            <option value="under_10k">Under $10,000</option>
                            <option value="10k_50k">$10,000 - $50,000</option>
                            <option value="50k_100k">$50,000 - $100,000</option>
                            <option value="100k_500k">$100,000 - $500,000</option>
                            <option value="500k_1m">$500,000 - $1M</option>
                            <option value="1m_5m">$1M - $5M</option>
                            <option value="5m_10m">$5M - $10M</option>
                            <option value="over_10m">Over $10M</option>
                            <option value="not_seeking">Not currently seeking funding</option>
                        </select>
                    </div>

                    <!-- Button Group -->
                    <div class="button-group">
                        <button type="button" class="btn btn-back" onclick="history.back()">Back</button>
                        <button type="submit" class="btn btn-continue">Continue</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('innovationForm');
            const checkboxItems = document.querySelectorAll('.checkbox-item');
            const continueBtn = document.querySelector('.btn-continue');

            // Handle checkbox item clicks
            checkboxItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    if (e.target.tagName !== 'INPUT') {
                        const checkbox = this.querySelector('input[type="checkbox"]');
                        checkbox.checked = !checkbox.checked;
                    }
                    
                    // Update visual state
                    if (this.querySelector('input[type="checkbox"]').checked) {
                        this.classList.add('selected');
                    } else {
                        this.classList.remove('selected');
                    }
                });
            });

            // Form validation
            form.addEventListener('submit', function(e) {
                const currentStage = document.getElementById('current_stage').value;
                const fundingNeeded = document.getElementById('funding_needed').value;
                const innovationTypes = document.querySelectorAll('input[name="innovation_type"]:checked');

                if (!currentStage || !fundingNeeded) {
                    e.preventDefault();
                    alert('Please fill in all required fields.');
                    return;
                }

                if (innovationTypes.length === 0) {
                    e.preventDefault();
                    alert('Please select at least one type of innovation.');
                    return;
                }
            });

            // Update continue button state based on form completion
            function updateContinueButton() {
                const currentStage = document.getElementById('current_stage').value;
                const fundingNeeded = document.getElementById('funding_needed').value;
                const innovationTypes = document.querySelectorAll('input[name="innovation_type"]:checked');

                if (currentStage && fundingNeeded && innovationTypes.length > 0) {
                    continueBtn.disabled = false;
                } else {
                    continueBtn.disabled = true;
                }
            }

            // Add event listeners for form validation
            document.getElementById('current_stage').addEventListener('change', updateContinueButton);
            document.getElementById('funding_needed').addEventListener('change', updateContinueButton);
            document.querySelectorAll('input[name="innovation_type"]').forEach(checkbox => {
                checkbox.addEventListener('change', updateContinueButton);
            });

            // Initial validation
            updateContinueButton();
        });
    </script>

{% endblock %}
