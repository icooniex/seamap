{% extends "onboarding/base.html" %}
{% load static %}

{% block content %}
<style>
    .step-content {
        display: none;
    }
    
    .step-content.active {
        display: block;
    }
    
    .progress-container {
        margin-bottom: 30px;
    }
    
    .progress-bar {
        transition: width 0.3s ease;
    }
    
    .step-navigation {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 30px;
    }
    
    .btn-back:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    
    .checkbox-group {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 12px;
        margin-top: 15px;
    }
    
    .checkbox-item {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .checkbox-item:hover {
        border-color: #007bff;
        background-color: #f8f9fa;
    }
    
    .checkbox-item.selected {
        border-color: #007bff;
        background-color: #e7f3ff;
    }
    
    .checkbox-item input[type="checkbox"] {
        margin-right: 12px;
        transform: scale(1.2);
    }
    
    .checkbox-item label {
        margin: 0;
        cursor: pointer;
        font-weight: 500;
    }
    
    /* Custom modal styling - Override all conflicting styles */
    .modal-backdrop {
        background-color: rgba(0, 0, 0, 0.5) !important;
        z-index: 1050 !important;
    }
    
    #validationModal {
        z-index: 1055 !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        display: none !important;
    }
    
    #validationModal.show {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
    }
    
    .modal-dialog {
        max-width: 500px !important;
        width: 90% !important;
        margin: 0 !important;
        position: relative !important;
    }
    
    .modal-content {
        border: none !important;
        border-radius: 12px !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3) !important;
        overflow: hidden !important;
        position: relative !important;
        background: white !important;
    }
    
    .modal-header {
        background-color: #f8f9fa !important;
        border-bottom: 1px solid #dee2e6 !important;
        padding: 20px 24px 16px !important;
    }
    
    .modal-body {
        padding: 24px !important;
        color: #495057 !important;
        line-height: 1.6 !important;
        font-size: 0.95rem !important;
    }
    
    .modal-footer {
        background-color: #f8f9fa !important;
        border-top: 1px solid #dee2e6 !important;
        padding: 16px 24px 20px !important;
        justify-content: center !important;
    }
    
    .modal-title {
        font-weight: 600 !important;
        color: #495057 !important;
        font-size: 1.1rem !important;
    }
    
    .modal-footer .btn {
        min-width: 100px !important;
        font-weight: 500 !important;
    }
    
    /* Force modal centering */
    .modal.fade {
        transition: opacity 0.15s linear !important;
    }
    
    .modal.fade .modal-dialog {
        transition: transform 0.15s ease-out !important;
        transform: translate(0, -50px) !important;
    }
    
    .modal.show .modal-dialog {
        transform: none !important;
    }
</style>

<!-- Main Content -->
<div class="main-content">
    <div class="onboarding-card">
        <!-- Role Indicator -->
        <div class="role-indicator" style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding:20px 10px;">
            <div class="role-icon startup-icon" style="margin-bottom: 0;">
                <i class="bi bi-rocket"></i>
            </div>
            <div>
                <div style="font-weight: 600; font-size: 1.1rem;">Startup</div>
                <div class="text-muted" style="font-size: 0.95rem;">Registration and Onboarding</div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="step-info">
                <span class="text-muted" id="step-info">Step 1 of 3 - Company Information</span>
            </div>
            <div class="progress">
                <div class="progress-bar" id="progress-bar" style="width: 33.33%"></div>
            </div>
        </div>

        <form id="startupOnboardingForm" method="POST" action="{% url 'onboarding_startup_single_page' %}">
            {% csrf_token %}
            
            <!-- Step 1: Company Information -->
            <div class="step-content active" data-step="1">
                <h2 class="form-title">Tell us about your company</h2>
                
                <!-- Company Name -->
                <div class="form-group">
                    <label for="company_name" class="form-label">Company Name</label>
                    <input type="text" class="form-control" id="company_name" name="company_name" 
                            placeholder="Your company or project name" required>
                </div>

                <!-- Website and Founded Year Row -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="website" class="form-label">Website (if available)</label>
                            <input type="url" class="form-control" id="website" name="website" 
                                    placeholder="www.example.com">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="founded_year" class="form-label">Founded Year</label>
                            <input type="number" class="form-control" id="founded_year" name="founded_year" 
                                    placeholder="e.g. 2020" min="1900" max="2025">
                        </div>
                    </div>
                </div>

                <!-- Team Size and Primary Location Row -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="team_size" class="form-label">Team Size</label>
                            <select class="form-select" id="team_size" name="team_size" required>
                                <option value="">Select team size</option>
                                <option value="1">1 person</option>
                                <option value="2-5">2-5 people</option>
                                <option value="6-10">6-10 people</option>
                                <option value="11-25">11-25 people</option>
                                <option value="26-50">26-50 people</option>
                                <option value="51-100">51-100 people</option>
                                <option value="100+">100+ people</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="primary_location" class="form-label">Primary Location</label>
                            <select class="form-select" id="primary_location" name="primary_location" required>
                                <option value="">Select country</option>
                                <option value="Singapore">Singapore</option>
                                <option value="Indonesia">Indonesia</option>
                                <option value="Thailand">Thailand</option>
                                <option value="Malaysia">Malaysia</option>
                                <option value="Philippines">Philippines</option>
                                <option value="Vietnam">Vietnam</option>
                                <option value="Cambodia">Cambodia</option>
                                <option value="Laos">Laos</option>
                                <option value="Myanmar">Myanmar</option>
                                <option value="Brunei">Brunei</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Brief Company Description -->
                <div class="form-group">
                    <label for="company_description" class="form-label">Brief Company Description</label>
                    <textarea class="form-control text-area" id="company_description" name="company_description" 
                                placeholder="Tell us briefly about your company, mission and team" rows="4"></textarea>
                </div>
            </div>

            <!-- Step 2: Innovation Information -->
            <div class="step-content" data-step="2">
                <h2 class="form-title">About your innovation</h2>
                
                <!-- Type of Innovation -->
                <div class="form-group">
                    <label class="form-label">Type of Innovation (select all that apply)</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="plastic_alternatives" name="innovation_type" value="plastic_alternatives">
                            <label for="plastic_alternatives">Eliminate & Redesign Packaging</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="recycling_technologies" name="innovation_type" value="recycling_technologies">
                            <label for="recycling_technologies">Refill & Reuse Solutions</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="waste_collection" name="innovation_type" value="waste_collection">
                            <label for="waste_collection">Reusable Packaging Collection/Drop Off</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="circular_economy" name="innovation_type" value="circular_economy">
                            <label for="circular_economy">Upcycling Plastic Waste</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="monitoring_tools" name="innovation_type" value="monitoring_tools">
                            <label for="monitoring_tools">Sustainable Alternative Materials</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="education_partnerships" name="innovation_type" value="education_partnerships">
                            <label for="education_partnerships">Education & Industry Partnerships</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="tracking_monitoring" name="innovation_type" value="tracking_monitoring">
                            <label for="tracking_monitoring">Tracking & Monitoring Waste</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="plastic_offsetting" name="innovation_type" value="plastic_offsetting">
                            <label for="plastic_offsetting">Plastic Footprint Offsetting</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="recycling_systems" name="innovation_type" value="recycling_systems">
                            <label for="recycling_systems">Enhancing Plastic Recycling Systems</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="waste_collection_systems" name="innovation_type" value="waste_collection_systems">
                            <label for="waste_collection_systems">Improved Waste Collection Systems</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="other" name="innovation_type" value="other">
                            <label for="other">Other</label>
                        </div>
                    </div>
                </div>

                <!-- Solution Description -->
                <div class="form-group">
                    <label for="solution_description" class="form-label">Please describe your solution and it's USP in one paragraph <span class="text-danger">*</span></label>
                    <textarea class="form-control text-area" id="solution_description" name="solution_description" 
                                placeholder="Tell us about your solution and what makes it unique" rows="4" required></textarea>
                </div>

                <!-- Current Stage of Solution -->
                <div class="form-group">
                    <label for="current_stage" class="form-label">Current Stage of Solution</label>
                    <select class="form-select" id="current_stage" name="current_stage" required>
                        <option value="">Select current stage</option>
                        <option value="idea">Ideation – Developing an idea, no product yet.</option>
                        <option value="prototype">Prototype – Initial MVP or prototype created.</option>
                        <option value="validation">Validation – Testing with early customers, gathering feedback.</option>
                        <option value="early">Early Growth – Generating revenue, growing customer base.</option>
                        <option value="scaling">Scaling – Expanding with proven business model and revenue.</option>
                        <option value="profitable">Established – Profitable, exploring new markets or innovations.</option>
                    </select>
                </div>

                <!-- Funding Needed -->
                <div class="form-group">
                    <label for="funding_needed" class="form-label">Funding Needed</label>
                    <select class="form-select" id="funding_needed" name="funding_needed" required>
                        <option value="">Select funding range</option>
                        <option value="under_10k">Under $10,000</option>
                        <option value="10k_50k">$10,000 - $50,000</option>
                        <option value="50k_100k">$50,000 - $100,000</option>
                        <option value="100k_500k">$100,000 - $500,000</option>
                        <option value="500k_1m">$500,000 - $1M</option>
                        <option value="1m_5m">$1M - $5M</option>
                        <option value="5m_10m">$5M - $10M</option>
                        <option value="over_10m">Over $10M</option>
                        <option value="not_seeking">Not currently seeking funding</option>
                    </select>
                </div>
            </div>

            <!-- Step 3: Startup Support -->
            <div class="step-content" data-step="3">
                <h2 class="form-title">Startup Support</h2>
                
                <!-- Support Areas -->
                <div class="form-group">
                    <label class="form-label">Which areas do you seek support in for your startup's growth and acceleration?</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="branding_marketing" name="support_areas" value="branding_marketing">
                            <label for="branding_marketing">Branding & Marketing</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="investment_funding" name="support_areas" value="investment_funding">
                            <label for="investment_funding">Investment Readiness and Access to Funding</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="manufacturing_supply" name="support_areas" value="manufacturing_supply">
                            <label for="manufacturing_supply">Manufacturing & Supply Chain</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="market_expansion" name="support_areas" value="market_expansion">
                            <label for="market_expansion">Market Expansion & Customer Acquisition</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="product_development" name="support_areas" value="product_development">
                            <label for="product_development">Product Development & R&D</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="regulatory_compliance" name="support_areas" value="regulatory_compliance">
                            <label for="regulatory_compliance">Regulatory & Compliance</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="sustainability" name="support_areas" value="sustainability">
                            <label for="sustainability">Sustainability & Circular Economy</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="talent_hiring" name="support_areas" value="talent_hiring">
                            <label for="talent_hiring">Talent & Hiring</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="technology_digital" name="support_areas" value="technology_digital">
                            <label for="technology_digital">Technology & Digital Transformation</label>
                        </div>
                    </div>
                </div>

                <!-- Support Details -->
                <div class="form-group">
                    <label for="support_details" class="form-label">Please share more about the areas of support you have selected</label>
                    <textarea class="form-control text-area" id="support_details" name="support_details" 
                                placeholder="Tell us more about the specific support you need" rows="4"></textarea>
                </div>

                <!-- Additional Information -->
                <div class="form-group">
                    <label for="additional_info" class="form-label">Is there any additional information you would like to share? (optional)</label>
                    <textarea class="form-control text-area" id="additional_info" name="additional_info" 
                                placeholder="Any additional information about your startup" rows="3"></textarea>
                </div>

                <!-- Consent Checkboxes -->
                <div class="form-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="consent_info" name="consent_info" required>
                        <label for="consent_info">
                            I agree to my personal data being stored and used to receive further information about SEA MaP events and matching opportunities
                        </label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="consent_marketplace" name="consent_marketplace" required>
                        <label for="consent_marketplace">
                            I consent to sharing my information on the Financing Marketplace for matching purposes, understanding that financial and sensitive details may be collected but won't be posted or shared without my explicit consent.
                        </label>
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="step-navigation">
                <button type="button" class="btn btn-back" id="backBtn" disabled>Back</button>
                <button type="button" class="btn btn-continue" id="nextBtn">Continue</button>
                <button type="submit" class="btn btn-continue" id="submitBtn" style="display: none;">Complete Registration</button>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap Modal for Validation Messages -->
<div class="modal fade" id="validationModal" tabindex="-1" aria-labelledby="validationModalLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="validationModalLabel">
                    <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>
                    Validation Required
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="validationModalBody">
                <!-- Validation message will be inserted here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK, Got it!</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('startupOnboardingForm');
    const stepContents = document.querySelectorAll('.step-content');
    const progressBar = document.getElementById('progress-bar');
    const stepInfo = document.getElementById('step-info');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    
    // Initialize Bootstrap modal
    let validationModal;
    const validationModalElement = document.getElementById('validationModal');
    const validationModalBody = document.getElementById('validationModalBody');
    
    // Initialize modal with more specific options
    function initializeModal() {
        if (typeof bootstrap !== 'undefined') {
            validationModal = new bootstrap.Modal(validationModalElement, {
                backdrop: 'static',
                keyboard: true,
                focus: true
            });
        }
    }
    
    // Wait for Bootstrap and DOM to be ready
    if (typeof bootstrap !== 'undefined') {
        initializeModal();
    } else {
        // Fallback initialization
        setTimeout(() => {
            initializeModal();
        }, 500);
    }
    
    let currentStep = 1;
    const totalSteps = 3;
    
    const stepTitles = {
        1: 'Step 1 of 3 - Company Information',
        2: 'Step 2 of 3 - Innovation Details',
        3: 'Step 3 of 3 - Support & Consent'
    };
    
    // Handle checkbox item clicks for better UX
    document.querySelectorAll('.checkbox-item').forEach(item => {
        item.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') {
                const checkbox = this.querySelector('input[type="checkbox"]');
                checkbox.checked = !checkbox.checked;
            }
            
            // Update visual state
            if (this.querySelector('input[type="checkbox"]').checked) {
                this.classList.add('selected');
            } else {
                this.classList.remove('selected');
            }
        });
    });
    
    function showValidationMessage(message) {
        validationModalBody.innerHTML = message;
        
        // Try multiple approaches to show the modal
        if (validationModal) {
            try {
                validationModal.show();
            } catch (error) {
                console.log('Bootstrap modal error, trying manual approach');
                showModalManually(message);
            }
        } else {
            // Reinitialize and try again
            initializeModal();
            setTimeout(() => {
                if (validationModal) {
                    validationModal.show();
                } else {
                    showModalManually(message);
                }
            }, 100);
        }
    }
    
    // Manual modal display as fallback
    function showModalManually(message) {
        const modal = document.getElementById('validationModal');
        const body = document.body;
        
        // Create backdrop
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop fade show';
        backdrop.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050;';
        
        // Show modal
        modal.style.display = 'flex';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.classList.add('show');
        
        // Add to body
        body.appendChild(backdrop);
        body.classList.add('modal-open');
        
        // Handle close
        const closeModal = () => {
            modal.style.display = 'none';
            modal.classList.remove('show');
            body.removeChild(backdrop);
            body.classList.remove('modal-open');
        };
        
        // Close button event
        modal.querySelector('.btn-close').onclick = closeModal;
        modal.querySelector('.btn-primary').onclick = closeModal;
        backdrop.onclick = closeModal;
    }
    
    function updateProgressAndInfo() {
        const progressWidth = (currentStep / totalSteps) * 100;
        progressBar.style.width = progressWidth + '%';
        stepInfo.textContent = stepTitles[currentStep];
        
        // Update button states
        backBtn.disabled = currentStep === 1;
        
        if (currentStep === totalSteps) {
            nextBtn.style.display = 'none';
            submitBtn.style.display = 'inline-block';
        } else {
            nextBtn.style.display = 'inline-block';
            submitBtn.style.display = 'none';
        }
    }
    
    function showStep(stepNumber) {
        stepContents.forEach(content => {
            content.classList.remove('active');
            if (parseInt(content.dataset.step) === stepNumber) {
                content.classList.add('active');
            }
        });
        
        currentStep = stepNumber;
        updateProgressAndInfo();
    }
    
    function validateStep(stepNumber) {
        const currentStepElement = document.querySelector(`[data-step="${stepNumber}"]`);
        const requiredFields = currentStepElement.querySelectorAll('[required]');
        let isValid = true;
        
        // Validate required fields
        requiredFields.forEach(field => {
            if (!field.value.trim()) {
                isValid = false;
                field.classList.add('is-invalid');
            } else {
                field.classList.remove('is-invalid');
            }
        });
        
        // Special validation for step 2 - at least one innovation type must be selected
        if (stepNumber === 2) {
            const innovationTypes = currentStepElement.querySelectorAll('input[name="innovation_type"]:checked');
            if (innovationTypes.length === 0) {
                isValid = false;
                showValidationMessage('Please select at least one type of innovation before continuing.');
                return false;
            }
        }
        
        // Special validation for step 3 - consent checkboxes
        if (stepNumber === 3) {
            const consentInfo = document.getElementById('consent_info');
            const consentMarketplace = document.getElementById('consent_marketplace');
            
            if (!consentInfo.checked || !consentMarketplace.checked) {
                isValid = false;
                showValidationMessage('Please accept both consent agreements to continue with your registration.');
                return false;
            }
        }
        
        if (!isValid && stepNumber < 3) {
            showValidationMessage('Please fill in all required fields before continuing to the next step.');
        }
        
        return isValid;
    }
    
    // Next button click handler
    nextBtn.addEventListener('click', function() {
        if (validateStep(currentStep)) {
            if (currentStep < totalSteps) {
                showStep(currentStep + 1);
            }
        }
    });
    
    // Back button click handler
    backBtn.addEventListener('click', function() {
        if (currentStep > 1) {
            showStep(currentStep - 1);
        }
    });
    
    // Form submission handler
    form.addEventListener('submit', function(e) {
        if (!validateStep(currentStep)) {
            e.preventDefault();
        }
    });
    
    // Remove invalid class on input
    document.querySelectorAll('input, select, textarea').forEach(input => {
        input.addEventListener('input', function() {
            if (this.classList.contains('is-invalid') && this.value.trim()) {
                this.classList.remove('is-invalid');
            }
        });
    });
    
    // Initialize the form
    updateProgressAndInfo();
});
</script>

{% endblock %}
